name: bigdataanalytics-lab2

x-airflow-common: &airflow-common
  image: ${AIRFLOW_IMAGE_NAME:-bigdataanalytics-airflow:lab2}
  build: .
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${AIRFLOW_DB_USER}:${AIRFLOW_DB_PASSWORD}@postgres-airflow:5432/${AIRFLOW_DB_NAME}
    AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "true"
    AIRFLOW__CORE__TEST_CONNECTION: Enabled
    AIRFLOW_CONN_VERTICA_DWH: vertica://dbadmin:${VERTICA_PASSWORD}@vertica:5433/${VERTICA_DB_NAME}
    # Source of the system marts.
    AIRFLOW_CONN_AIRFLOW_METADATA: postgresql://${AIRFLOW_DB_USER}:${AIRFLOW_DB_PASSWORD}@postgres-airflow:5432/${AIRFLOW_DB_NAME}
  volumes:
    - ./dags:/opt/airflow/dags
    - ./sql:/opt/airflow/sql
    - ./data:/opt/airflow/data
    - ./logs:/opt/airflow/logs
    - ./plugins:/opt/airflow/plugins
  user: "${AIRFLOW_UID}:0"
  depends_on:
    postgres-airflow:
      condition: service_healthy
    vertica:
      condition: service_healthy

services:
  vertica:
    build: ./vertica
    image: bigdataanalytics-vertica:lab2
    environment:
      VERTICA_DB_NAME: ${VERTICA_DB_NAME}
      VERTICA_PASSWORD: ${VERTICA_PASSWORD}
    ports:
      # 5433 on the host is taken by the lab1 PostgreSQL warehouse.
      - "127.0.0.1:${VERTICA_HOST_PORT}:5433"
    volumes:
      - vertica-data:/data
    networks:
      default:
        # Vertica stores node IPs in its catalog, so the address must not change between restarts.
        ipv4_address: 172.28.0.10
    stop_grace_period: 60s
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/vertica-ready && vsql -U dbadmin -w \"$$VERTICA_PASSWORD\" -d \"$$VERTICA_DB_NAME\" -tAc 'SELECT 1'"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 120s

  postgres-airflow:
    image: postgres:16
    environment:
      POSTGRES_USER: ${AIRFLOW_DB_USER}
      POSTGRES_PASSWORD: ${AIRFLOW_DB_PASSWORD}
      POSTGRES_DB: ${AIRFLOW_DB_NAME}
    volumes:
      - airflow-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ${AIRFLOW_DB_USER}"]
      interval: 5s
      retries: 10

  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - |
        set -e
        airflow db migrate
        airflow users create \
          --username "${AIRFLOW_WWW_USER}" --password "${AIRFLOW_WWW_PASSWORD}" \
          --firstname Air --lastname Flow --role Admin --email admin@example.com
    restart: on-failure

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      # 8080 is taken by lab1, so both stands can run side by side.
      - "127.0.0.1:8081:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 15s
      timeout: 10s
      retries: 10
    restart: always
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    restart: always
    depends_on:
      airflow-init:
        condition: service_completed_successfully

networks:
  default:
    ipam:
      config:
        - subnet: 172.28.0.0/24

volumes:
  airflow-db:
  vertica-data:

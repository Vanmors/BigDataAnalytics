name: bigdataanalytics-demo

x-airflow: &airflow
  image: bigdataanalytics-airflow:demo
  build:
    context: .
    args:
      PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
  user: "50000:0"
  environment:
    PYTHONPATH: /opt/airflow/plugins
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres-airflow:5432/airflow
    AIRFLOW_CONN_TASK3_MONGO: mongodb://mongo:27017/task3?replicaSet=task3
    AIRFLOW_CONN_DWH_POSTGRES: postgresql://dwh:dwh@postgres-dwh:5432/dwh
  volumes:
    - demo-data:/opt/airflow/data
    - demo-logs:/opt/airflow/logs
  depends_on:
    postgres-airflow:
      condition: service_healthy
    postgres-dwh:
      condition: service_healthy

services:
  postgres-airflow:
    image: postgres:16
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - demo-airflow-db:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U airflow -d airflow]
      interval: 2s
      timeout: 3s
      retries: 60

  postgres-dwh:
    image: postgres:16
    environment:
      POSTGRES_USER: dwh
      POSTGRES_PASSWORD: dwh
      POSTGRES_DB: dwh
    volumes:
      - demo-dwh-db:/var/lib/postgresql/data
      - demo-data:/data:ro
    healthcheck:
      test: [CMD-SHELL, pg_isready -U dwh -d dwh]
      interval: 2s
      timeout: 3s
      retries: 60

  mongo:
    image: mongo:8.0.34@sha256:4a4ab5d4834207389e0d7270fac988e21ffedccecba77991a552f755df229907
    command: [mongod, --replSet, task3, --bind_ip_all]
    volumes:
      - demo-mongo-db:/data/db
    healthcheck:
      test: [CMD, mongosh, --quiet, --eval, "db.adminCommand({ping:1}).ok"]
      interval: 2s
      timeout: 3s
      retries: 60

  mongo-init:
    image: mongo:8.0.34@sha256:4a4ab5d4834207389e0d7270fac988e21ffedccecba77991a552f755df229907
    entrypoint: [mongosh, "mongodb://mongo:27017/?directConnection=true", --quiet, --eval]
    command:
      - "if (db.adminCommand({currentOp:1}).fsyncLock) throw new Error('Mongo is locked; inspect the previous baseline before retry'); load('/scripts/task3-init.js');"
    volumes:
      - ./mongo/task3-init.js:/scripts/task3-init.js:ro
    depends_on:
      mongo:
        condition: service_healthy

  airflow-init:
    <<: *airflow
    entrypoint: [python, /opt/airflow/demo.py]
    command: [init]

  airflow-webserver:
    <<: *airflow
    command: webserver
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: [CMD, curl, --fail, http://localhost:8080/health]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 20s
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  demo:
    <<: *airflow
    entrypoint: [python, /opt/airflow/demo.py]
    command: [run]
    depends_on:
      mongo-init:
        condition: service_completed_successfully
      airflow-webserver:
        condition: service_healthy
      airflow-scheduler:
        condition: service_started

volumes:
  demo-airflow-db:
  demo-dwh-db:
  demo-mongo-db:
  demo-data:
  demo-logs:
